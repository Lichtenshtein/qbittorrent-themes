name: Build Themes

on:
  # push:
  #   tags: ["v*"]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release after the build"
        type: boolean
        required: true
        default: false
      release_tag:
        description: "Release tag (required if release creation is enabled for manual triggers; for example, v1.0.0)"
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build deps (jq, zip, Qt rcc, Qt lrelease)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zip qtbase5-dev-tools qttools5-dev-tools
          # Ensure Qt5 rcc is on PATH on Ubuntu
          if [ -d "/usr/lib/qt5/bin" ]; then
            echo "/usr/lib/qt5/bin" >> "$GITHUB_PATH"
          fi
          rcc -v || true
          lrelease -version || true

      - name: Build all themes
        run: |
          chmod +x ./gen.sh
          ./gen.sh

      - name: List results
        run: |
          ls -la qt || true
          ls -la webui || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: themes
          if-no-files-found: error
          path: |
            qt/*.qbtheme
            webui/*.tar.gz
            webui/*.zip

  release:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.create_release == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag on manual dispatch
        if: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.release_tag == '' }}
        run: |
          echo "Error: when manually creating a release, you must specify a release_tag (for example, v1.0.0)."
          exit 1

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: themes
          path: dist

      - name: Flatten artifact structure
        run: |
          mkdir -p release
          find dist -type f \( -name '*.qbtheme' -o -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          ls -la release/

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
